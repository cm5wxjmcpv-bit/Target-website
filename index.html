<!doctype html>
<html lang="en">

      content="0; url=https://target-dashboard.micah-lackey.chatgpt.site"

      body {
        min-height: 100vh;

      }

        width: min(420px, calc(100% - 48px));

      h1 {

        font-size: 1.5rem;
      }
      p {
        margin: 0 0 20px;
        color: #546579;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 11px 18px;
        border-radius: 8px;
        background: #0b4f86;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

    <script>
      window.location.replace("https://target-dashboard.micah-lackey.chatgpt.site");
